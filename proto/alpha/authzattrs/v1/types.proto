syntax = "proto3";
package alpha.authzattrs.v1;

import "gogoproto/gogo.proto";

option go_package = "alpha/x/authzattrs/api";

message AuthzRecord {
  string address = 1;
  string msg_type = 2;
  bytes constraints_hash = 3;
  int64 valid_until = 4;
  uint64 policy_version = 5;
  uint64 issuer_set_id = 6;
  bool revoked = 7;
}

message IssuerRecord {
  uint64 issuer_set_id = 1;
  string address = 2;
  bytes pub_key = 3;
  bool active = 4;
}

message IssuerSignature {
  string issuer_address = 1;
  bytes signature = 2;
}

message Params {
  uint64 current_policy_version = 1;
  int64 max_validity_duration = 2;
  uint32 min_quorum = 3;
  uint64 issuer_set_id = 4;
  bool fail_closed = 5;
}
