syntax = "proto3";
package alpha.authzattrs.v1;

import "alpha/authzattrs/v1/types.proto";
import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "alpha/x/authzattrs/api";

message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated AuthzRecord records = 2 [(gogoproto.nullable) = false];
  repeated IssuerRecord issuers = 3 [(gogoproto.nullable) = false];
}
