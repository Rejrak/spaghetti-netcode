syntax = "proto3";

package packets;

option go_package = "pkg/cmPackets";

message AuthMessage {
    string address = 1;
    string operation = 2;
}

message ResponseMessage {
    bool success = 1;
    string message = 2;
}

message CosmosPacket {
    string sender_id = 1;
    oneof msg {
        AuthMessage authMessage = 2;
        ResponseMessage responseMessage = 3;
    }
}